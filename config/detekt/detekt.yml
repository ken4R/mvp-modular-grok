complexity:
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  LongMethod:
    allowedLines: 80

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  VariableNaming:
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true
